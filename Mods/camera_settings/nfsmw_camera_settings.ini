; Settings of nfsmw_camera_settings.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value written here. Options > Camera writes the camera sections itself when
; you accept, so most of this never needs editing by hand.

; One section per camera view: bumper, hood, close, far, super_far, drift, pursuit. A view with no section (or a missing key) is the game's own.
; Every value is a difference from the game's own value for the car you drive (cars differ a little), except enabled and mirror, which are
; 1 (on) or 0 (off) themselves:
;   enabled        0 = Next / Previous Camera View skip this view
;   mirror         1 = the rear view mirror is shown in this view
;   fov            degrees added to the field of view
;   speed_fov      degrees of field of view added at 300 km/h (the game has none: this is the value itself)
;   height         metres added to the camera's height
;   distance       metres added to the camera's distance (negative = further behind the car)
;   pitch          degrees added to the camera's pitch
;   smoothing      percentage points added to 100 % (-50 = half as smooth)
;   acceleration   percentage points added to 100 % (-70 = 30 % of the game's pull back under power)
;   tilt           percent of the car's tilt (the game has none: this is the value itself)

[close]
fov=-2.9974
speed_fov=15
height=-0.02
distance=-0.3
pitch=2
smoothing=-50
acceleration=-70
tilt=70

[far]
fov=-5
speed_fov=15
height=0.55
distance=-0.564
pitch=1
acceleration=-50

[super_far]
fov=35.0024
speed_fov=20
height=1.7
distance=-3
pitch=1.0005
enabled=0

[drift]
fov=-4.9957
height=1
distance=-4.2
pitch=-8.9949
enabled=0

[pursuit]
mirror=1
fov=-9.9988
speed_fov=25
height=1
distance=-2.5
pitch=-6.9988
