; Settings of nfsmw_dev_tools.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value written here. 1 = on, 0 = off.

[diagnostics]
; Logs where the game ends itself (ExitProcess / TerminateProcess) and where it has an access violation.
enabled=1

[quick_start]
; 0 = the whole tool is off.
enabled=1
; Skips the intro movies (the EA logo, the PSA, the attract movie at startup).
skip_intros=1
; The name of a save. If it exists, the splash screen ("click to continue") moves on by itself and that save is loaded
; straight away (no list to pick from); you land on its "Load complete" message. Empty, or a name with no save: the game
; starts as usual.
auto_load_alias=
