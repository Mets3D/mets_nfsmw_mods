; Settings of nfsmw_dev_tools.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value written here. 1 = on, 0 = off.

[diagnostics]
; Logs where the game ends itself (ExitProcess / TerminateProcess) and where it has an access violation.
enabled=1

[quick_start]
; 0 = the whole tool is off.
enabled=1
; Skips the intro movies (the EA logo, the PSA, the attract movie at startup).
skip_intros=1
; The name of a save. If it exists, the splash screen ("click to continue") moves on by itself and that save is loaded
; straight away (no list to pick from); you land on its "Load complete" message. Empty, or a name with no save: the game
; starts as usual.
auto_load_alias=

[game_speed]
; Two keys that slow the game down and speed it up: each press halves or doubles the speed (1/16 to 8; the physics gets coarse above about 2). The game's own
; slow motion (the speedbreaker) still works on top of it.
enabled=1
; F1 to F12, a letter or digit, Minus, Plus, Comma, Period, PageUp, PageDown, Home, End, Insert, Delete, NumpadPlus, NumpadMinus, or a virtual-key code number.
slower_key=Minus
faster_key=Plus

[free_camera]
; A camera that flies around during a race. The key switches it on and off. Move with the game's own keyboard bindings:
; gas / brake forward / back, steer left / right sideways, shift up / down rise / sink, nitro faster; the mouse looks around;
; speedbreaker puts your car where the camera is. Your car does not drive while the camera is on.
enabled=1
; F1 to F12, a letter or digit, or a virtual-key code number.
toggle_key=F1
; Metres per second, and how many times faster with nitro held.
speed=20
nitro_multiplier=4
; Degrees per pixel of mouse movement.
mouse_sensitivity=0.1
