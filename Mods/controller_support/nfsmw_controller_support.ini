; Settings of nfsmw_controller_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value written here.
; The Settings page, the Controller Prompts option and the Controls menu write their own settings to this file
; (see the end), so most of it never needs editing by hand.

[pad]
; 0 = the plugin does nothing.
enabled=1
; Dead zone of the left and right stick and of the triggers, 0 to 0.5: how far one has to move before it counts. Raise it if the
; car or the camera drifts with the stick at rest. These are the values of controllers that have none of their own (see the end).
left_stick_deadzone=0.15
right_stick_deadzone=0.15
trigger_deadzone=0.05
; LT and RT are two separate axes (so they can be bound to different actions). 0 = the game's single combined trigger axis.
split_triggers=1
; Every XInput controller drives the game, each with its own bindings, not just the first one. 0 = only the first.
use_all_xinput_controllers=1
; Steering, gas and brake follow the stick or trigger smoothly. 0 = on or off, like keys.
analog_input=1

[buttons]
; The pictures of the menus' button prompts while a controller was used last: xbox, playstation, switch or off. Each controller can have
; its own (the Settings page, Controller Prompts); this is for those that have not, and for controllers that are not XInput.
button_prompts=xbox
; Our default controller bindings (RT accelerates, LT brakes, ...). 0 = the game's own. Only changes what the controls start
; with or are reset to; bindings you set in the Controls menu are kept.
better_default_controller_bindings=1

[look]
; Camera look while driving, with the right stick, bound keys and the mouse. 0 = off.
enabled=1
; Degrees per second at full stick.
stick_speed=150
; Degrees per mouse count. 0 = no mouse look.
mouse_sensitivity=0.15
; 1 = look up and down the other way round.
invert_y=0
; Seconds without look input before the view returns behind the car (0 = never), and how fast it does. Each player sets their own
; delay in Options > Player > Free Look Reset (see the end); this is for those that have not.
return_delay=3
return_speed=2
; The lowest and highest the view may go, in degrees above the car.
min_pitch=-10
max_pitch=60

[rumble]
; Read at start-up. 0 = no rumble. The strength of each effect is set per controller, on the Settings page of the Controls menu.
enabled=1

; Written by the mod, not to be edited by hand (the rumble levels can be, and are picked up while the game runs):
;   [controller_<id>]         the Settings page's values for each XInput controller (<id> is vid_pid_serial of a controller that can be
;                             told apart from others, else the slot number 1 to 4): left_stick_deadzone,
;                             right_stick_deadzone and trigger_deadzone (0 to 0.5; the triggers default to 0.05), and
;                             button_prompts (xbox, playstation, switch or off).
;   [rumble_<id>]             the Settings page's vibration (1 = on, 0 = off) and levels for each XInput controller, 0 to 100 for each of collisions,
;                             landings, shifts, nos, drift, wheelspin, rev_limiter, road, engine, tire_blowout and
;                             engine_blown. A missing level takes its default.
;   [look_player_1], [look_player_2]  return_delay: the Free Look Reset of each player (Options > Player), in seconds, 0 = never.
;   [look_bindings]           the bindings of the four look rows (left, right, up, down) of the Controls menu.
;   [pad_bindings]            the Controls menu's bindings of the second and later controllers, one key per controller and
;                             binding (<controller>_<binding>).
