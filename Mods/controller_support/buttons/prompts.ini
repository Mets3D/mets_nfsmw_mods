; Which picture each of the game's button prompts shows while a controller is in use.
;
; Left of the "=": the game's own picture of the prompt (the keyboard key or button it normally shows).
; Right of the "=": the picture to show instead, a file in the folder of the style (xbox\, playstation\ or switch\), without ".png".
; The style is chosen per controller with button_prompts=xbox, playstation or switch in nfsmw_controller_support.ini (the Settings page does it).
; Pictures follow the position of the buttons, as the game sees them: the Xbox layout's A is the bottom button, which a Switch controller
; labels B, so Accept shows the Switch picture B there.
;
; Edit a picture or this file, then run `python Mods/set_mods.py --mode ours`: it builds the pictures into nfsmw_controller_buttons.tpk and
; copies this file next to it, where the plugin reads it.

[xbox]
PC_KEY_ENTER                 = A          ; accept
PC_KEY_ESC                   = B          ; back
PC_KEY_ESC_FRENCH            = B
PC_KEY_Q                     = B          ; the main menu's "Quit": B quits there
PC_KEY_1                     = Y
PC_KEY_2                     = X
PC_KEY_3                     = View
PC_KEY_4                     = Menu
L1                           = LB
R1                           = RB
PC_GREATERTHAN_LESSTHAN_KEYS = LT_RT      ; the car Showcase's zoom (the triggers, which zoom by how far they are pulled; the shoulder buttons do too)
PC_ARROW_KEYS                = LeftStick  ; the car Showcase's "View Car"
PC_ARROW_KEYS_UP_DOWN        = Empty
PC_LOAD                      = Empty

[playstation]
PC_KEY_ENTER                 = Cross
PC_KEY_ESC                   = Circle
PC_KEY_ESC_FRENCH            = Circle
PC_KEY_Q                     = Circle
PC_KEY_1                     = Triangle
PC_KEY_2                     = Square
PC_KEY_3                     = Select
PC_KEY_4                     = Start
L1                           = L1
R1                           = R1
PC_GREATERTHAN_LESSTHAN_KEYS = L2_R2
PC_ARROW_KEYS                = LeftStick
PC_ARROW_KEYS_UP_DOWN        = Empty
PC_LOAD                      = Empty

[switch]
PC_KEY_ENTER                 = B          ; the bottom button (Xbox A)
PC_KEY_ESC                   = A          ; the right button (Xbox B)
PC_KEY_ESC_FRENCH            = A
PC_KEY_Q                     = A
PC_KEY_1                     = X          ; the top button (Xbox Y)
PC_KEY_2                     = Y          ; the left button (Xbox X)
PC_KEY_3                     = Minus
PC_KEY_4                     = Plus
L1                           = L
R1                           = R
PC_GREATERTHAN_LESSTHAN_KEYS = ZL_ZR
PC_ARROW_KEYS                = LeftStick
PC_ARROW_KEYS_UP_DOWN        = Empty
PC_LOAD                      = Empty
