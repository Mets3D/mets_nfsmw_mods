; Which picture each of the game's button prompts shows while a controller is in use.
;
; Left of the "=": the game's own picture of the prompt (the keyboard key or button it normally shows).
; Right of the "=": the picture to show instead, a file in the folder of the style (xbox\ or playstation\), without ".png".
; The style is chosen with icons=xbox or icons=playstation in nfsmw_controller_support.ini.
;
; Edit a picture or this file, then run Mods\set_mods.ps1: it builds the pictures into nfsmw_controller_buttons.tpk and
; copies this file next to it, where the plugin reads it.

[xbox]
PC_KEY_ENTER                 = A          ; accept
PC_KEY_ESC                   = B          ; back
PC_KEY_ESC_FRENCH            = B
PC_KEY_Q                     = B          ; the main menu's "Quit": B quits there
PC_KEY_1                     = Y
PC_KEY_2                     = X
PC_KEY_3                     = View
PC_KEY_4                     = Menu
L1                           = LB
R1                           = RB
PC_GREATERTHAN_LESSTHAN_KEYS = LB_RB      ; the car Showcase's zoom
PC_ARROW_KEYS                = LeftStick  ; the car Showcase's "View Car"
PC_ARROW_KEYS_UP_DOWN        = Empty
PC_LOAD                      = Empty

[playstation]
PC_KEY_ENTER                 = Cross
PC_KEY_ESC                   = Circle
PC_KEY_ESC_FRENCH            = Circle
PC_KEY_Q                     = Circle
PC_KEY_1                     = Triangle
PC_KEY_2                     = Square
PC_KEY_3                     = Select
PC_KEY_4                     = Start
L1                           = L1
R1                           = R1
PC_GREATERTHAN_LESSTHAN_KEYS = L1_R1
PC_ARROW_KEYS                = LeftStick
PC_ARROW_KEYS_UP_DOWN        = Empty
PC_LOAD                      = Empty
