; Every setting is optional; a missing one takes the value written here.
; The Settings page and the Controls menu write their own settings here (see the end), so most of this never needs editing by hand.

[pad]
; 0 = the plugin does nothing.
enabled=1
; Dead zones of the sticks and triggers, 0 to 0.5. Raise one if the car or camera drifts with the stick at rest.
; These are the defaults for controllers that have no values of their own (see the end).
left_stick_deadzone=0.15
right_stick_deadzone=0.15
trigger_deadzone=0.02

[buttons]
; Button prompt pictures in the menus: xbox, playstation, switch or off. A controller's own choice (Settings page) wins.
button_prompts=xbox
; Our default controller bindings (RT accelerates, LT brakes, ...). 0 = the game's own. Only affects what the controls start with
; or are reset to; bindings you set in the Controls menu are kept.
better_default_controller_bindings=1

[look]
; Camera look while driving (right stick, bound keys, mouse). 0 = off.
enabled=1
; Degrees per second at full stick; degrees per mouse count (0 = no mouse look); 1 = inverted up/down.
stick_speed=150
mouse_sensitivity=0.15
invert_y=0
; Seconds without look input before the view returns behind the car (0 = never), and how fast. Options > Player > Free Look Reset
; sets the delay per player; this is the default.
return_delay=3
return_speed=2
; The lowest and highest the view may go, in degrees above the car.
min_pitch=-10
max_pitch=60

[controls]
; 1 = the Controls menu asks (Yes keeps the changed bindings, No puts them back) when you leave it, or switch controller, after changing bindings. 0 = it keeps them without asking.
confirm_keybinds=0

[rumble]
; 0 = no rumble (read at start-up). The strength of each effect is set per controller on the Controls menu's Settings page.
enabled=1

; Per-profile data (dead zones, button prompts, rumble, look and controller bindings) is kept in controller_settings.ini in each
; profile's save folder. Sections [controller_<id>], [rumble_<id>], [look_bindings] and [pad_bindings] written here by hand are the defaults
; for a profile that lacks a key, and take the changes while a profile has no save folder yet. <id> is vendor_product_serial, or the XInput slot (1-4).
; Written here only: [look_player_1] and [look_player_2], the return_delay of each player (Options > Player).
