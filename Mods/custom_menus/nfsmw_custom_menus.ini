; Settings of nfsmw_custom_menus.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one is on. Set a feature to 0 to turn it off.

[features]
; Removes some confirmation dialogs (and the split screen's transmission question). 0 asks them again.
fewer_popups=1
; Story movies and tutorials can be skipped. 0 = they need their own conditions again.
skippable_cutscenes=1
; The main menu's Career entry goes straight into your career. 0 opens the Career main menu again.
skip_career_menu=1
