; Settings of nfsmw_improved_ai_opponents.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value noted here. 1 = on, 0 = off.
; The [player_1] and [player_2] settings are what the Options > AI Driving page (pause menu, needs Custom Menus) edits and saves here.
; Player 1 is the first local player (the top picture in split screen), player 2 the second.

[player_1]
; Who drives the car: off (a human), vanilla (the game's racing AI, set up as it is for the opponents: their shortcut rule, nitrous as far as the human players
; have it, the skill below) or improved (the same AI with our changes: reverses out of a stuck position sooner, weighs the roads when it plans its
; route, and the nitro and shortcuts settings below). (Missing: off for player 1, improved for player 2.)
; While racing, F7 hands player 1's car to the improved AI and back, and F9 makes the AIs plan their route again from where they are.
control=off
; How well the AI drives, 0 to 100, for the vanilla and the improved AI. (Missing = 100.)
skill=100
; The improved AI's nitrous: disabled (never), fair (as far as the human players have nitrous: the game's own rule, so none when they have none)
; or allowed (whatever the other players have). (Missing = fair.)
nitro=fair
; The improved AI and the roads marked as shortcuts: avoid (it never plans one), allowed (it plans one when it is the better route) or always
; (it prefers them). (Missing = allowed.) The game's own rule lets a player's AI take a shortcut only when it is already at its entrance.
shortcuts=allowed
; The game's own catch-up: an AI that is behind the other players drives better and accelerates harder, as the opponents do. (Missing = 0.)
catch_up=0
; Draws what the AI plans in this player's picture: the route (cyan), the corridor it steers in and its steering target. With the car driven by a
; human, the improved AI plans its route beside the car. (Missing = 1.)
overlay=1

[player_2]
control=improved
skill=100
nitro=fair
shortcuts=allowed
catch_up=0
overlay=1

[improved_ai]
; How the improved AI's route search weighs the roads (the search finds the shortest way unless it is told otherwise).
; Extra cost of a road narrower than the widest road that leaves the same node, in percent of its length at the narrowest. 0 = width is ignored.
; (Missing = 100.)
width_weight=100
; What the car can do, for the cost of a turn the route asks for: the cornering grip (m/s^2) and the braking (m/s^2) it has on the way
; to the turn. (Missing = 10 and 12.)
lateral_accel=10
brake_accel=12
; Cost, in metres, of a turn that asks for twice what the car can do. Bigger = turns it cannot make are avoided more. 0 = ignored. (Missing = 30.)
kinematic_weight=30

[debug]
; 1 = write lines to the log for finding out what the AI does: each route search (where it starts), each road segment of a new route with its width and
; flags, and the biggest extra costs of the route search. (Missing = 0.)
log=0

[overlay]
; The lines in the pictures (see overlay= above). F8 shows the whole road network around the car (road nodes and the links between them). (Missing = 1.)
enabled=1
; 1 = a wall or a pillar hides the lines behind it. (Missing = 1.)
depth_test=1
; 1 = the other roads near the car (not the planned route) are drawn as orange corridors: their left and right edge over the drivable width, curved
; where the road is. Shows whether a road the AI never takes has a corridor at all. (Missing = 1.)
alternative_corridors=1
; A road narrower than this (m) is drawn as narrow on the route. (Missing = 10.)
reference_width=10
; A turn of the route sharper than this (degrees) is marked. (Missing = 20.)
sharp_turn_degrees=20
