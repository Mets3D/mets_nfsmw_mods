; Settings of nfsmw_improved_ai_opponents.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value noted here. 1 = on, 0 = off.
; The [player_1] and [player_2] settings are what the Options > AI Driving page (pause menu, needs Custom Menus) edits and saves here.
; Player 1 is the first local player (the top picture in split screen), player 2 the second.

[player_1]
; Who drives the car: off (a human), vanilla (the game's racing AI, set up as it is for the opponents: their shortcut rule, nitrous as far as the human players
; have it, the skill below) or improved (the same AI with our changes: reverses out of a stuck position sooner, weighs the roads when it plans its
; route, and the fair nitrous, fair performance and shortcuts settings below). (Default: off for player 1, improved for player 2.)
; While racing, F7 hands player 1's car to the improved AI and back, and F9 makes the AIs plan their route again from where they are.
control=off
; How well the AI drives, 0 to 100, for the vanilla and the improved AI. (Default = 100.)
skill=100
; The improved AI's nitrous: 1 = fair (as far as the human players have nitrous: the game's own rule, so none when they have none); 0 = whatever its car has.
; (Default = 1.)
fair_nitrous=1
; The improved AI's performance: 1 = fair (like the game's AI it holds back to the weakest player's car: its top speed and grip); 0 = its own car's. (Default = 1.)
fair_performance=1
; The improved AI and the roads marked as shortcuts: avoid (it never plans one), allowed (it plans one when it is the better route) or always
; (it prefers them). (Default = allowed.) The game's own rule lets a player's AI take a shortcut only when it is already at its entrance.
shortcuts=allowed
; The improved AI and the race's own route: 1 = like the game's AI it is held to the road segments the race was set up with (during a race the game only lets
; the nav the car steers by, the target ahead of it, be on those, wherever the car is, so a car on another road is sent back to the route's road); 0 = the nav
; may be on any road segment, starting from the road the car is on, and the route search chooses from there by its costs. (Default = 1.)
follow_race_route=1
; The improved AI's steering: 1 = arbitrary, like the vanilla AI's (the wheel turns to any angle at once, at any speed); 0 = like a human player's: the range of the wheel
; falls with speed, and the wheel turns at a limited rate, so that a player who gave the same inputs would get the same result. (Default = 1.)
super_steer=1
; The improved AI and the heavy props beside and on the road (barrels, posts, booths: not the light ones such as bins, hydrants and chairs): 1 = it steers around
; them, and the AI Logic overlay draws their collision boxes; 0 = it drives through them like the game's AI. (Default = 0.)
avoid_props=0
; The game's own catch-up: an AI that is behind the other players drives better and accelerates harder, as the opponents do. (Default = 0.)
catch_up=0
; What is drawn in this player's picture (F8 steps through them): off, ai_logic (the route the AI has planned and its steering target; the improved AI plans
; its route beside the car while a human drives it), roads (the road network around the camera) or cost (pick the nodes of a route to see what it costs). (Default = off.)
overlay=off

[player_2]
control=improved
skill=100
fair_nitrous=1
fair_performance=1
shortcuts=allowed
follow_race_route=1
super_steer=1
avoid_props=0
catch_up=0
overlay=off

[debug]
; 1 = write lines to the log for finding out what the AI does: each route search (where it starts), each road segment of a new route with its width and
; flags, and the biggest extra costs of the route search. (Default = 0.)
log=0
