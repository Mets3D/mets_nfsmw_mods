; Settings of nfsmw_split_screen_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value noted here. 1 = on, 0 = off.

[options]
; Each player has a minimap of their own, instead of just 1 minimap that favors player 1. (Missing = 1.)
use_split_minimap=1
; The game skips drawing small and far away objects (the scenery) to be faster, which in split screen makes them pop in and out
; and some shadows vanish. 0 = they are drawn as in a single player game, which costs a little speed on slow computers.
; (Missing = 1, the game's own rule.)
cull_small_objects=0

; Written by the mod: [player_1] and [player_2] minimap=0 when a player turned their minimap off (Options > Player > Minimap).
