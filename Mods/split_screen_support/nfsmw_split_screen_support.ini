; Settings of nfsmw_split_screen_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; the default of each is noted with it. 1 = on, 0 = off.

[options]
; The most players the Players row of a race offers (2 up to 8). More than 4 have only been tried with 5, and there are 5 devices (4 controllers and the keyboard). (Default: 4.)
max_players=4

; The most cars a race has, players and opponents together (4 up to 16: the game's race state keeps its racers in tables of 16; more would need those tables moved, which is not done). It sets what the cars need at start-up: the slots
; for customized paint, the engine sounds of the opponents, and the memory of the car loader and the sound system (about 130 MB of the game's address space for 16). A computer
; that runs out of memory in big races can lower it; the AI Opponents row stops at this number minus the players. (Default: 16.)
max_racers=16

; The AI opponents of a split screen race, with the Quick Race's AI Opponents, Difficulty and Catch Up rows in its options (the game has no opponents in split screen).
; 0 = a split screen race has no opponents, as in the game. (Default: 1.)
enable_ai_opponents_in_split_screen=1

; After a split screen race: Accept on the race options starts the next race with the same cars and devices, and "2 Select Car" (X on a controller) lets the player who
; pressed it choose another car. 0 = Press Start and Car Select before every race, as in the game. (Default: 1.)
optional_car_select=1

; The world map of a split screen race shows every player's car and the opponents, in the colours of the minimaps (the game shows the first player only). 0 = as in the game.
; (Default: 1.)
show_all_racers_on_world_map=1

; A player who is out of a split screen race (knocked out, totalled, engine blown) gives their part of the screen to the others a few seconds later: the parts
; next to it slide over it, and the last player racing gets the whole screen. 0 = every player keeps their part to the end, as in the game. (Default: 1.)
allow_split_screen_overtake=1

; The race's intro cutscene in a split screen race (the game ends it at once). 0 = no cutscene, as in the game. (Default: 1.)
intro_cutscene=1

; Where the game goes after a split screen race: track_options (the race's options screen, the default), track_select, or menu (the game's own: the Quick Race menu).
;after_race=track_options

; The game skips drawing small and far away objects (the scenery) to be faster, which in split screen makes them pop in and out
; and some shadows vanish. 1 = the game's own rule; 0 = they are drawn as in a single player game, which costs a little speed on slow computers. (Default: 0.)
cull_small_objects=0

; The size, in MB, of the memory the game keeps the loaded part of the track in (its streaming pool): the game's own is 242 MB with the HD content, which two cars far apart
; fill; the whole track is 576 MB. It is made when the game starts, in the game's address space (a 32 bit program: 4 GB at most), and the biggest size up to this one that leaves
; enough of the address space free is made. Two starts of the game crashed in its chunk loader with 1024 and 960 MB (not with 768 or less, not understood), so the default is 512.
; 0 = the game's own. (Default: 512.)
streaming_pool_mb=512

; With more than two players the reflections on the cars update at most this fast ("Car Reflection Update Rate": 1 = one cube face a frame, 2 = three faces, 3 = six);
; 0 = the game's own setting. (Default: 1.)
reflection_rate_many_players=1

; ---------------------------------------------------------------------------------------------------------------------------------------------------------------
; Diagnostics, for development and bug reports.
[diagnostics]
; With four players, the log gets the GPU and CPU time of each player's pass every 300 frames. (Default: 0.)
frame_timing=0

; Logs the objects of each HUD package ("dump:" lines) when the race starts. (Default: 0.)
dump_hud=0

; ---------------------------------------------------------------------------------------------------------------------------------------------------------------
; Written by the mod: [race_options] (the rows of the split screen race options) layout=horizontal or vertical (the players' pictures in rows or in columns),
; start=front, rear or random (who stands in front on the grid), tollbooth_time=30 to 300 (percent of the game's time in a tollbooth race);
; [player_1] to [player_4] sound_volume=0 to 100 (Options > Player > Split-Screen Volume, percent: how loud the sounds are that are played for that player in a
; split screen race: the sounds nearest to them), minimap=0 when a player turned their minimap off (Options > Player > Minimap), hud_scale=40 to 200 (Options >
; Player > HUD Scale, percent: how big a player's HUD is; 100 is the HUD as the game has it in a player's part of the screen: all of it for one player or two,
; half the size for a player who has a quarter of the screen).
