; Settings of nfsmw_split_screen_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value noted here. 1 = on, 0 = off.

[options]
; The game skips drawing small and far away objects (the scenery) to be faster, which in split screen makes them pop in and out
; and some shadows vanish. 0 = they are drawn as in a single player game, which costs a little speed on slow computers.
; (Missing = 1, the game's own rule.)
cull_small_objects=0
; Work in progress, off by default: a "Players" row (2, 3 or 4) in the options of a split screen race (needs nfsmw_custom_menus), and with 3 or 4
; a second round of Press Start and Car Select for the players 3 and 4, and a race for three or four (views, HUDs and input devices; needs mets_controller_support).
; With three players the first has the top half of the screen.
; (Missing = 0.)
more_players=0
; The Quick Race's Opponents, Difficulty and Catch Up rows in the options of a split screen race, and the AI opponents in the race (the game has none in split
; screen). 0 = a split screen race has no opponents, as in the game. (Missing = 1.)
ai_in_split_screen=1
; Each player of a split screen race keeps a copy of the six faces of the car reflection cube map, so the game updates a few faces a frame, as in a game
; for one player. 0 = every pass draws all six faces (a third of the frame time with four players). (Missing = 1.)
reflection_copies=1
; With more than two players the reflection updates at most this fast ("Car Reflection Update Rate": 1 = one cube face a frame, 2 = three faces, 3 = six);
; 0 = the game's own setting. (Missing = 1.)
reflection_rate_four_players=1
; Diagnostic: with four players, the log gets the GPU and CPU time of each player's pass every 300 frames. (Missing = 0.)
frame_timing=0

; Diagnostic: logs the objects of each HUD package ("dump:" lines) when the race starts. (Missing = 0.)
dump_hud=0

; Where the game goes after a split screen race: track_options (the race's options screen, the default), track_select, or menu (the game's own: the Quick Race menu).
;after_race=track_options

; The most players the Players row of a race offers (2 up to 8). More than 4 have only been tried with 5, and there are 5 devices (4 controllers and the keyboard).
;max_players=4

; Diagnostic, for a race with more than two players: every player drives this car. test_car_handle is the handle of a car of the profile's garage (the first
; number of a line of the dev_tools command log_cars, 141 is the NSX NA1, the biggest car on disk: 155 MB) and test_car the name of its folder in CARS.
; (Missing = nobody is forced.)
;test_car=nsxna1
;test_car_handle=141

; Written by the mod: [player_1] to [player_4] minimap=0 when a player turned their minimap off (Options > Player > Minimap), hud_scale=40 to 100 (Options >
; Player > HUD Scale, percent: how big a player's HUD is; 100 is the HUD as the game has it in a player's part of the screen: all of it for one player or two,
; half the size for a player who has a quarter of the screen).
