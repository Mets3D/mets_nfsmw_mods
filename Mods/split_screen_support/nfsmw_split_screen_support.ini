; Settings of nfsmw_split_screen_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; the default of each is noted with it. 1 = on, 0 = off.

[options]
; Hide the EA Trax song display during split screen. Music keeps playing. (Default: 1.)
hide_ea_trax=1

; The most players the Players row of a race offers. (Default: 4.)
; Higher than 4 is not tested.
max_players=4

; Maximum number of racers allowed in a race (players and AI opponents combined).
; Higher than 16 is not implemented. (Default: 16.)
max_racers=16

; Enable AI opponents in split-screen mode, revealing "AI Opponents", "Difficulty" and "Catch Up" in the race options. (Default: 1.)
enable_ai_opponents_in_split_screen=1

; After playsession's first split-screen race, the menus will skip car selection by default.
; Players can press a new "Select Car" button in the race options screen. Whichever player presses that button can select a different car. (Default: 1.)
optional_car_select=1

; The world map of a split screen race shows every player's and AI opponent's car, instead of just Player 1.
; (Default: 1.)
show_all_racers_on_world_map=1

; A player who is out of a split screen race (knocked out, totalled, engine blown) gives their part of the screen to the others. (Default: 1.)
allow_split_screen_overtake=1

; Allow rendering a rear-view mirror for each player. Also in Options > Advanced Video. (Default: 1)
; Does not force mirrors to be enabled - That's up to the game or other mods.
allow_rear_view_mirror=1

; The race's intro cutscene in a split screen race (the game ends it at once). 0 = no cutscene, as in the game. (Default: 1.)
intro_cutscene=1

; Where the game goes after a split screen race: track_options (the race's options screen, the default), track_select, or menu (the game's own: the Quick Race menu).
;after_race=track_options

; Cull small objects for performance, as the vanilla split-screen implementation. (Default: 0.)
cull_small_objects=0

; The size, in MB, of the memory the game keeps the loaded part of the track in (its streaming pool). Try increasing this if encountering missing chunks of road, but note that 960mb and above crashed during testing.
; 0 = the game's own (242 MB). (Default: 512.)
streaming_pool_mb=512

; With more than two players the reflections on the cars update at most this fast ("Car Reflection Update Rate": 1 = one cube face a frame, 2 = three faces, 3 = six);
; 0 = the game's own setting. (Default: 1.)
reflection_rate_many_players=1

[minimap]
; The markers of the minimaps and the world map in a split screen race. Colours are RRGGBB (hexadecimal, as in an HTML colour).
; (Default: FF9040 orange)
player_1_color=FF9040
; (Default: 2090FF blue)
player_2_color=2090FF
; (Default: 40E060 green)
player_3_color=40E060
; (Default: C050FF purple)
player_4_color=C050FF
; (Default: E8E8E8 white)
opponent_color=E8E8E8
opponent_size=75

[diagnostics]
; With four players, the log gets the GPU and CPU time of each player's pass every 300 frames. (Default: 0.)
frame_timing=0

; Logs the objects of each HUD package ("dump:" lines) when the race starts. (Default: 0.)
dump_hud=0

; ---------------------------------------------------------------------------------------------------------------------------------------------------------------
[race_options]
; Race options can be changed in the split-screen race options menus. The values below are written by the mod, so changing them directly in the .ini may be lost.
; split-screen layout. `horizontal` or `vertical`. (Default: horizontal)
layout=horizontal
; Starting player car positions. `front`, `rear`, or `random`.
start=front
; Percent modifier on the amount of time available in a tollbooth race.
tollbooth_time=100

; Player options can be changed in the Pause Menu->Options->Player menu. The values below are written by the mod, so changing them directly in the .ini may be lost.
[player_1]
; Range: 0-100. How much this player's screen contributes to the game's audio.
sound_volume=100
; Whether this player's minimap is shown in the HUD. (Default: 1)
minimap=1
; Range: 40-200. (Default: 100).
hud_scale=100

[player_2]
sound_volume=100
minimap=1
hud_scale=100

[player_3]
sound_volume=100
minimap=1
hud_scale=100

[player_4]
sound_volume=100
minimap=1
hud_scale=100
