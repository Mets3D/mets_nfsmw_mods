; Settings of nfsmw_split_screen_support.asi. Put this file in scripts/mets_mods/ (next to the other mods' .ini files).
; Every setting is optional; a missing one takes the value noted here. 1 = on, 0 = off.

[options]
; The game skips drawing small and far away objects (the scenery) to be faster, which in split screen makes them pop in and out
; and some shadows vanish. 0 = they are drawn as in a single player game, which costs a little speed on slow computers.
; (Missing = 1, the game's own rule.)
cull_small_objects=0
; Work in progress, off by default: a "Players" row (2, 3 or 4) in the options of a split screen race (needs nfsmw_custom_menus), and with 3 or 4
; a second round of Press Start and Car Select for the players 3 and 4, and a race for three or four (views, HUDs and input devices; needs mets_controller_support).
; With three players the first has the top half of the screen.
; (Missing = 0.)
more_players=0
; The Quick Race's Opponents, Difficulty and Catch Up rows in the options of a split screen race, and the AI opponents in the race (the game has none in split
; screen). 0 = a split screen race has no opponents, as in the game. (Missing = 1.)
ai_in_split_screen=1
; Work in progress: the race's intro cutscene in a split screen race (the game ends it at once). 0 = no cutscene, as in the game. (Missing = 1.)
intro_cutscene=1
; The size, in MB, of the memory the game keeps the loaded part of the track in (its streaming pool): the game's own is 242 MB with the HD content, which two cars far apart
; fill; the whole track is 576 MB. It is made when the game starts, in the game's address space (a 32 bit program: 4 GB at most, of which a race of four players uses 3 GB
; or more): the biggest size up to this one that leaves `streaming_pool_keep_mb` of the address space free (and a free block of 600 MB) is made; a pool that leaves too little
; made the game crash when it started. The game has about 3.4 GB of address space free when it makes the pool and takes about 1.9 GB more in a race of four players, so
; 2400 MB are to stay free by default. Two starts of the game crashed in its chunk loader with 1024 and 960 MB (not with 768 or less, not understood), so the default is 512. 0 = the game's own. (Missing = 512 and 2400.)
streaming_pool_mb=512
streaming_pool_keep_mb=2400
; How many texture packs the game can have at once (the cars, the minimap tiles, the track's texture sections): the game's own is 128, and a game with four players driving apart
; or many cars needs more: a full list made it crash. 32 bytes each. 0 = the game's own. (Missing = 1024.)
texture_pack_slots=1024
; A virtual key code (122 = F11; 0 = none): pressing it writes a dump to the log of the state of the track streamer, the game's memory and where the cars are (for a
; report of missing geometry: tell where the cars were). The log also gets a line about memory every 30 seconds of a race. (Missing = 122.)
streaming_dump_key=122
; How many cars can have their own customized paint at a time (the game has 4; every car needs a skin slot, and a car without one is drawn stock). 16 are the most racers a race has;
; CARS\TEXTURES.BIN needs a DUMMY_SKIN<n> and DUMMY_WHEEL<n> texture for each (Redux v3 has 20; a car whose slot has none keeps its stock paint). 4 or less = the game's own. (Missing = 16.)
skin_slots=16
; Megabytes added to the car loader's memory (the game's 115 MB holds about seven car models, and sixteen cars of other models filled it: the paint of the oldest cars was drawn black). 0 = the game's own. (Missing = 256.)
car_pool_extra_mb=256
; How many opponents have an engine sound at a time (the game has 4: the others race in silence). 15 is every opponent of a race of 16. 4 or less = the game's own. (Missing = 15.)
ai_engine_sounds=15
; Megabytes of memory for the sound system (the game: 5.4; the engine sounds of the opponents are loaded into it, and with 4 or more opponents in a split screen race they did not fit:
; none of them was heard). 0 = the game's own. (Missing = 32.)
audio_pool_mb=32
; How many objects the sound system's middleware can have at once (the game: 256; a race of 2 players and 14 opponents used 199, and an engine that finds none is silent). 0 = the game's own. (Missing = 1024.)
csis_slots=1024
; How many samples the sound hardware can play at once (the game: 64; a race of 2 players and 14 opponents used 48). Up to 255; 0 = the game's own. (Missing = 128.)
sound_voices=128
; The cars of players 3 and up (which are silent in the game, whose sound system has two players) sound like opponents do, and count as listeners for the cars near them. 0 = silent. (Missing = 1.)
extra_player_sounds=1
; With 1 (needs extra_player_sounds), the cars of players 3 and up have the sounds of the first two players' cars (the engine heard from inside the car at every rev, tyres, wind, gears, nitro)
; and not those of an opponent's car. 0 = they sound like opponents. (Missing = 1.)
extra_player_sound_set=1
; How close (in metres) an opponent has to be to a player for its engine to have a sound at all (the game: 135, from the nearest of the players). 0 = the game's. (Missing = 0.)
ai_engine_radius=0
; In a split screen race with 2 or fewer opponents the game gives them synthesized engines (Ginsu), which are silent there; 1 gives them the sampled ones (as with 3 or more). (Missing = 1.)
ai_sampled_engines=1
; Each player of a split screen race keeps a copy of the six faces of the car reflection cube map, so the game updates a few faces a frame, as in a game
; for one player. 0 = every pass draws all six faces (a third of the frame time with four players). (Missing = 1.)
reflection_copies=1
; With more than two players the reflection updates at most this fast ("Car Reflection Update Rate": 1 = one cube face a frame, 2 = three faces, 3 = six);
; 0 = the game's own setting. (Missing = 1.)
reflection_rate_four_players=1
; Diagnostic: with four players, the log gets the GPU and CPU time of each player's pass every 300 frames. (Missing = 0.)
frame_timing=0

; Diagnostic: logs the objects of each HUD package ("dump:" lines) when the race starts. (Missing = 0.)
dump_hud=0

; Where the game goes after a split screen race: track_options (the race's options screen, the default), track_select, or menu (the game's own: the Quick Race menu).
;after_race=track_options

; The most players the Players row of a race offers (2 up to 8). More than 4 have only been tried with 5, and there are 5 devices (4 controllers and the keyboard).
;max_players=4

; Diagnostic, for a race with more than two players: every player drives this car. test_car_handle is the handle of a car of the profile's garage (the first
; number of a line of the dev_tools command log_cars, 141 is the NSX NA1, the biggest car on disk: 155 MB) and test_car the name of its folder in CARS.
; (Missing = nobody is forced.)
;test_car=nsxna1
;test_car_handle=141

; Written by the mod: [player_1] to [player_4] sound_volume=0 to 100 (Options > Player > Split-Screen Volume, percent: how loud the sounds are that are played for that player in a
; split screen race: the sounds nearest to them), minimap=0 when a player turned their minimap off (Options > Player > Minimap), hud_scale=40 to 100 (Options >
; Player > HUD Scale, percent: how big a player's HUD is; 100 is the HUD as the game has it in a player's part of the screen: all of it for one player or two,
; half the size for a player who has a quarter of the screen).
